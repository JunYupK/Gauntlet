# PR마다 하네스가 스스로를 검증한다.
#
# 두 가지를 본다.
#  1. `./gradlew test` — 유닛·속성·관문 테스트 전부
#  2. `./gradlew record` → `record --verify` — 스펙 §11 T4가 요구하는 R1
#     (재현 가능성) 검사. 번들을 만들고 다시 만들어 바이트 단위로 대조한다.
#
# 2번을 CI에 두는 이유는 스펙이 "R1이 테스트로 존재한다"고 못박기 때문이다.
# 발표에서 R1을 주장할 때 이 잡의 로그가 곧 증거가 된다.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다. 마지막 커밋의
# 판정만이 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 + 재현 검증
    runs-on: ubuntu-latest
    env:
      # CLI의 한국어 메시지가 로그에서 깨지지 않게 한다. ARENA_EXIT_CODE
      # 줄 자체는 순수 ASCII라 이 설정과 무관하게 읽히지만(규칙서 §8),
      # 사람이 읽을 사유 메시지는 이게 있어야 읽힌다.
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 테스트
        run: ./gradlew test --console=plain --no-daemon

      # 아래 두 스텝은 Gradle의 종료 코드를 믿지 않는다.
      #
      # 규칙서 §8: `arenaExec`은 하네스 오류(3)일 때만 태스크를 실패시킨다.
      # 관문 반려(1)는 세대 루프의 정상적인 결과이지 빌드 고장이 아니기
      # 때문이다. 그 대가로 **재현 검증 실패(1)도 BUILD SUCCESSFUL로
      # 끝난다** — CI가 `./gradlew`의 종료 코드만 보면 R1이 깨진 PR을
      # 초록 불로 통과시킨다. 그래서 표준 출력 마지막 줄의
      # ARENA_EXIT_CODE=<n>을 직접 읽는다.
      #
      # 줄이 아예 없는 경우도 실패로 친다(§8, log.md D72): 그 줄을 찍는
      # 것은 ArenaApplication.run 자신이므로, 거기 닿기 전에 JVM이 죽으면
      # (잡히지 않은 Error, OOM, 강제 종료) 줄이 안 나오는데 Gradle은
      # 3이 아니라는 이유로 성공으로 끝낸다.
      - name: 발표 번들 생성
        run: |
          set -o pipefail
          ./gradlew record --console=plain --no-daemon | tee record.log
          code=$(grep -o 'ARENA_EXIT_CODE=[0-3]' record.log | tail -1 | cut -d= -f2)
          if [ -z "$code" ]; then
            echo "::error::ARENA_EXIT_CODE 줄이 없다 — 하네스가 죽었다 (규칙서 §8)"
            exit 1
          fi
          if [ "$code" != 0 ]; then
            echo "::error::번들 생성 실패 ARENA_EXIT_CODE=$code"
            exit 1
          fi

      - name: 재현 검증 (R1)
        run: |
          set -o pipefail
          ./gradlew record -Pverify --console=plain --no-daemon | tee verify.log
          code=$(grep -o 'ARENA_EXIT_CODE=[0-3]' verify.log | tail -1 | cut -d= -f2)
          if [ -z "$code" ]; then
            echo "::error::ARENA_EXIT_CODE 줄이 없다 — 하네스가 죽었다 (규칙서 §8)"
            exit 1
          fi
          if [ "$code" != 0 ]; then
            echo "::error::재현 검증 실패 ARENA_EXIT_CODE=$code — R1이 깨졌다"
            exit 1
          fi

      # 실패했을 때 어느 테스트가 왜 죽었는지 클릭 한 번으로 보게 한다.
      - name: 테스트 리포트 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7
          if-no-files-found: ignore

  # 프론트엔드(web/) 검증. `test` 잡과 별개로 둔 이유는 하나가 Java
  # 하네스를, 하나가 Next.js 정적 export를 보기 때문이다 — 서로의 실패가
  # 서로를 가리면 어느 쪽이 죽었는지 로그를 열어봐야 알게 된다.
  web:
    name: 프론트엔드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }

      # 데모 번들을 다시 만들어 커밋된 fixtures와 대조한다. 어긋나면
      # 백엔드가 wire 스키마를 바꿨는데 픽스처를 갱신하지 않은 것이다 —
      # 그러면 프론트 테스트가 낡은 데이터 위에서 초록 불을 낸다.
      - name: 데모 번들 재생성 대조
        run: |
          set -o pipefail
          ./gradlew fixture --console=plain --no-daemon | tee fixture.log
          code=$(grep -o 'ARENA_EXIT_CODE=[0-3]' fixture.log | tail -1 | cut -d= -f2)
          if [ "$code" != 0 ]; then
            echo "::error::데모 번들 생성 실패 ARENA_EXIT_CODE=${code:-없음}"
            exit 1
          fi
          git diff --exit-code -- web/fixtures \
            || { echo "::error::커밋된 데모 번들이 현재 코드의 출력과 다르다 — ./gradlew fixture 후 커밋할 것"; exit 1; }

      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build:demo
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # 스모크가 실패했을 때 어느 화면이 왜 죽었는지 트레이스로 본다.
      - name: Playwright 리포트 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore
